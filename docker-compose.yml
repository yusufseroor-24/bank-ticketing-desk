services:
  identity-service:
    build: ./identity-service
    init: true
    restart: always
    ports:
      - "8081:8081"
    environment:
      JAVA_TOOL_OPTIONS: -Xmx384m
      DB_URL: jdbc:postgresql://postgres_db:5432/bankdesk
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in your .env file}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in your .env file}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      DIDIT_API_KEY: ${DIDIT_API_KEY:-}
      DIDIT_WORKFLOW_ID: ${DIDIT_WORKFLOW_ID:-}
      DIDIT_WEBHOOK_SECRET: ${DIDIT_WEBHOOK_SECRET:-}
      KYC_CALLBACK_URL: ${KYC_CALLBACK_URL:-http://localhost:8081/index.html?kyc=done}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    volumes:
      - identity_uploads:/app/uploads
    depends_on:
      postgres_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - postgres

  notification-service:
    build: ./notification-service
    init: true
    restart: always
    ports:
      - "8084:8084"
    environment:
      JAVA_TOOL_OPTIONS: -Xmx384m
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in your .env file}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - postgres

  ticket-service:
    build: ./ticket-service
    init: true
    restart: always
    ports:
      - "8082:8082"
    environment:
      JAVA_TOOL_OPTIONS: -Xmx384m
      DB_URL: jdbc:postgresql://postgres_db:5432/bankdesk
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in your .env file}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in your .env file}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
    volumes:
      - ticket_uploads:/app/uploads
    depends_on:
      postgres_db:
        condition: service_healthy
      identity-service:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - postgres

  fraud-service:
    build: ./fraud-service
    init: true
    restart: always
    ports:
      - "8083:8083"
    environment:
      JAVA_TOOL_OPTIONS: -Xmx384m
      DB_URL: jdbc:postgresql://postgres_db:5432/bankdesk
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in your .env file}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in your .env file}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      postgres_db:
        condition: service_healthy
      identity-service:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - postgres

  postgres_db:
    image: postgres:18.6
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: bankdesk
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in your .env file}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d bankdesk"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - postgres

  kafka:
    image: apache/kafka:4.1.0
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: [ "CMD-SHELL", "KAFKA_HEAP_OPTS='-Xmx128m' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 20s
      timeout: 60s
      retries: 20
      start_period: 90s
    networks:
      - postgres

  pgadmin:
    image: dpage/pgadmin4:9.18
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in your .env file}
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - postgres

networks:
  postgres:
    driver: bridge

volumes:
  postgres:
  pgadmin:
  identity_uploads:
  ticket_uploads: