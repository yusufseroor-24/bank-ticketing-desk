spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

spring.cloud.gateway.server.webmvc.routes[0].id=ticket-agent-categories
spring.cloud.gateway.server.webmvc.routes[0].uri=${TICKET_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/admin/users/*/categories

spring.cloud.gateway.server.webmvc.routes[1].id=identity-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${IDENTITY_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/auth/**,/api/kyc/**,/api/users/**,/api/admin/users/**,/api/admin/audit-logs

spring.cloud.gateway.server.webmvc.routes[2].id=ticket-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${TICKET_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/tickets/**,/api/categories,/api/admin/categories/**,/api/admin/tickets/**,/api/admin/sla-policies/**,/api/admin/sla-reports/**

spring.cloud.gateway.server.webmvc.routes[3].id=fraud-service
spring.cloud.gateway.server.webmvc.routes[3].uri=${FRAUD_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/admin/transactions/**,/api/admin/fraud-alerts

spring.cloud.gateway.server.webmvc.routes[4].id=notification-service
spring.cloud.gateway.server.webmvc.routes[4].uri=${NOTIFICATION_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/notifications/**,/api/admin/system-events

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}