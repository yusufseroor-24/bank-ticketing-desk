# H2 (in-memory database) in PostgreSQL mode: the tests never touch your real bankdesk database
spring.datasource.url=jdbc:h2:mem:bankdesk;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

jwt-secret=cucumber-test-secret-that-is-long-enough-for-hs256-signing
internal.api-key=cucumber-key

ai.service.url=http://localhost:1
app.ai.max-calls-per-hour=20

app.upload.dir=target/cucumber-uploads

app.virustotal.api-key=
app.virustotal.min-interval-ms=16000

app.sla.check-interval-ms=3600000

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=3000

spring.kafka.consumer.group-id=ticket-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ga.bankdesk.event
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.concurrency=3