#H2 (in-memory database) in PostgreSQL mode: the tests never touch your real bankdesk database
spring.datasource.url=jdbc:h2:mem:bankdesk;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

jwt-secret=cucumber-test-secret-that-is-long-enough-for-hs256-signing
internal.api-key=cucumber-key

ai.service.url=http://localhost:1

app.sla.check-interval-ms=3600000