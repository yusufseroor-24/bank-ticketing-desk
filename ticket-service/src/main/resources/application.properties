spring.application.name=ticket-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bankdesk}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

jwt-secret=${JWT_SECRET}

identity.service.url=${IDENTITY_SERVICE_URL:http://localhost:8081}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8084}
internal.api-key=${INTERNAL_API_KEY:}

app.upload.dir=${UPLOAD_DIR:uploads}

app.virustotal.api-key=${VIRUSTOTAL_API_KEY:}
app.virustotal.min-interval-ms=16000

app.sla.check-interval-ms=60000
