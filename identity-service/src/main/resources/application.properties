spring.application.name=identity-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bankdesk}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

jwt-secret=${JWT_SECRET}
jwt-expiration-ms=86400000

internal.api-key=${INTERNAL_API_KEY:}

app.upload.dir=${UPLOAD_DIR:uploads}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_USERNAME:no-reply@bankdesk.local}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:8081}

app.kyc.didit.base-url=${DIDIT_BASE_URL:https://verification.didit.me}
app.kyc.didit.api-key=${DIDIT_API_KEY:}
app.kyc.didit.workflow-id=${DIDIT_WORKFLOW_ID:}
app.kyc.didit.webhook-secret=${DIDIT_WEBHOOK_SECRET:}
app.kyc.callback-url=${KYC_CALLBACK_URL:http://localhost:8081/index.html?kyc=done}

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=3000