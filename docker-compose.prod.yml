x-logging: &logging
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION:-us-east-1}
    awslogs-group: bankdesk
    awslogs-create-group: "true"
    tag: "{{.Name}}"

services:
  identity-service:
    image: ${REGISTRY}/bankdesk/identity-service:${IMAGE_TAG:-latest}
    init: true
    restart: always
    logging: *logging
    environment:
      JAVA_TOOL_OPTIONS: -Xmx384m
      DB_URL: jdbc:postgresql://${RDS_ENDPOINT}:5432/bankdesk
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      DIDIT_API_KEY: ${DIDIT_API_KEY:-}
      DIDIT_WORKFLOW_ID: ${DIDIT_WORKFLOW_ID:-}
      DIDIT_WEBHOOK_SECRET: ${DIDIT_WEBHOOK_SECRET:-}
      FRONTEND_BASE_URL: ${PUBLIC_URL}
      KYC_CALLBACK_URL: ${KYC_CALLBACK_URL}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    volumes:
      - identity_uploads:/app/uploads
    depends_on:
      kafka:
        condition: service_healthy

  notification-service:
    image: ${REGISTRY}/bankdesk/notification-service:${IMAGE_TAG:-latest}
    init: true
    restart: always
    logging: *logging
    environment:
      JAVA_TOOL_OPTIONS: -Xmx384m
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FRONTEND_BASE_URL: ${PUBLIC_URL}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  ai-service:
    image: ${REGISTRY}/bankdesk/ai-service:${IMAGE_TAG:-latest}
    init: true
    restart: always
    logging: *logging
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-}

  ticket-service:
    image: ${REGISTRY}/bankdesk/ticket-service:${IMAGE_TAG:-latest}
    init: true
    restart: always
    logging: *logging
    environment:
      JAVA_TOOL_OPTIONS: -Xmx384m
      DB_URL: jdbc:postgresql://${RDS_ENDPOINT}:5432/bankdesk
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      AI_SERVICE_URL: http://ai-service:8085
    volumes:
      - ticket_uploads:/app/uploads
    depends_on:
      identity-service:
        condition: service_started
      kafka:
        condition: service_healthy

  fraud-service:
    image: ${REGISTRY}/bankdesk/fraud-service:${IMAGE_TAG:-latest}
    init: true
    restart: always
    logging: *logging
    environment:
      JAVA_TOOL_OPTIONS: -Xmx384m
      DB_URL: jdbc:postgresql://${RDS_ENDPOINT}:5432/bankdesk
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      identity-service:
        condition: service_started
      kafka:
        condition: service_healthy

  api-gateway:
    image: ${REGISTRY}/bankdesk/api-gateway:${IMAGE_TAG:-latest}
    init: true
    restart: always
    logging: *logging
    ports:
      - "80:8080"
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
      IDENTITY_SERVICE_URL: http://identity-service:8081
      TICKET_SERVICE_URL: http://ticket-service:8082
      FRAUD_SERVICE_URL: http://fraud-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL}
    depends_on:
      - identity-service
      - ticket-service
      - fraud-service
      - notification-service

  ngrok:
    image: ngrok/ngrok:latest
    restart: always
    command: http --url=${NGROK_DOMAIN} api-gateway:8080
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      - api-gateway

  kafka:
    image: apache/kafka:4.1.0
    restart: always
    logging: *logging
    environment:
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: [ "CMD-SHELL", "KAFKA_HEAP_OPTS='-Xmx128m' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1" ]
      interval: 20s
      timeout: 60s
      retries: 20
      start_period: 90s

volumes:
  identity_uploads:
  ticket_uploads: