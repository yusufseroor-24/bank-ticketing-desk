spring.application.name=bankdesk
spring.profiles.active=dev

jwt-secret=${JWT_SECRET}
jwt-expiration-ms=86400000

app.kyc.didit.base-url=${DIDIT_BASE_URL:https://verification.didit.me}
app.kyc.didit.api-key=${DIDIT_API_KEY:}
app.kyc.didit.workflow-id=${DIDIT_WORKFLOW_ID:}
app.kyc.didit.webhook-secret=${DIDIT_WEBHOOK_SECRET:}
app.kyc.callback-url=${KYC_CALLBACK_URL:http://localhost:8080/index.html?kyc=done}